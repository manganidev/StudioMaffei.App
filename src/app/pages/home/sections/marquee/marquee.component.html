<div class="marquee" role="region" aria-label="Aree di attività dello studio">
  <div class="marquee__track">
    @for (copy of copies; track copy) {
      <ul class="marquee__group" [attr.aria-hidden]="copy === 1 ? 'true' : null">
        @for (item of items; track item) {
          <li>
            {{ item }}
            <span class="marquee__sep" aria-hidden="true"></span>
          </li>
        }
      </ul>
    }
  </div>
</div>
