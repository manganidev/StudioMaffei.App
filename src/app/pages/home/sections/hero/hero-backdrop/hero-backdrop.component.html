<div class="glow glow--blue"></div>
<div class="glow glow--gold"></div>
<div class="grid"></div>

<svg class="loggia" viewBox="0 0 1440 400" preserveAspectRatio="xMidYMax slice" focusable="false">
  <g class="loggia__lines" fill="none">
    <path class="l l--lines" pathLength="1" [attr.d]="lines" />
    <path class="l l--arches" pathLength="1" [attr.d]="arches" />
    <path class="l l--columns" pathLength="1" [attr.d]="columns" />
    <path class="l l--tondi" pathLength="1" [attr.d]="tondi" />
  </g>
  <path class="comet" pathLength="1" [attr.d]="arches" />
</svg>
