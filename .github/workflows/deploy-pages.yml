name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Il sito sarà servito da https://<utente>.github.io/<repo>/, quindi serve il base-href del repo
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      # Fallback: le rotte sconosciute (es. /privacy ricaricata) vengono servite dall'app
      - run: cp dist/studio-maffei.app/browser/index.html dist/studio-maffei.app/browser/404.html

      # Il web.config serve solo su IIS (dominio finale), non su GitHub Pages
      - run: rm -f dist/studio-maffei.app/browser/web.config

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/studio-maffei.app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
